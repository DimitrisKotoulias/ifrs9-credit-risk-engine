[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "End-to-end credit risk modelling & IFRS 9 ECL engine"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    # Upper bound: optbinning 0.19 calls check_array(force_all_finite=...), renamed in
    # sklearn 1.6. utils/_compat.py shims it, but the bound keeps a clean install honest.
    "scikit-learn>=1.3,<1.9",
    # Modelling
    "statsmodels>=0.14",
    "lightgbm>=4.0",
    # Required by models/pd_challenger.py; without it the challenger benchmark table
    # disappears from the report with only a non-fatal warning (FLAWS-N14).
    "xgboost>=2.0",
    "optbinning>=0.19",
    "lifelines>=0.27",
    "shap>=0.44",
    # Plots
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.18",
    # Config
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Data
    "kaggle>=1.5",
    # HTTP + .env, used by data/download_macro.py to pull the FRED series. These were
    # pinned in requirements.txt but missing here, so a `pip install -e .` produced an
    # environment where the live macro path could not run and silently fell back to the
    # bundled offline table.
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Toolchain, not runtime. ruff/mypy/pytest/pre-commit were declared as runtime
# dependencies, so every install of the package pulled the whole test and lint toolchain,
# while `[dev]` held only notebook extras.
dev = [
    "ruff>=0.4",
    "mypy>=1.5",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ipykernel",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/credit_risk --cov-report=term-missing -q"


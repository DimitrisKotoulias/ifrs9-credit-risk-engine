# ── Reproducibility ───────────────────────────────────────────────────────────
random_seed: 42

# ── Portfolio reporting date ─────────────────────────────────────────────────
# The as-of date for exposure, staging and provisioning. Loan age (and therefore the
# amortised EAD) is measured against it, so this must match the data snapshot: the
# LendingClub accepted-loan file ends at 2018Q4.
reporting_date: "2018-12-31"

# ── Data source ───────────────────────────────────────────────────────────────
data:
  source: real               # real | synthetic
  synthetic_n_loans: 50000
  kaggle_dataset: "wordsforthewise/lending-club"
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  accepted_file: accepted_2007_to_2018Q4.csv.gz
  rejected_file: rejected_2007_to_2018Q4.csv.gz

# ── Target definition (PD) ────────────────────────────────────────────────────
target:
  bad_statuses:
    - "Charged Off"
    - "Default"
    - "Does not meet the credit policy. Status:Charged Off"
    - "Late (31-120 days)"
  good_statuses:
    - "Fully Paid"
    - "Does not meet the credit policy. Status:Fully Paid"
  # Remaining statuses are excluded (indeterminate/immature)

# ── Leakage deny-list (post-origination features) ────────────────────────────
leakage:
  deny_list:
    - recoveries
    - collection_recovery_fee
    - total_pymnt
    - total_pymnt_inv
    - total_rec_prncp
    - total_rec_int
    - total_rec_late_fee
    - last_pymnt_d
    - last_pymnt_amnt
    - next_pymnt_d
    - last_credit_pull_d
    # FICO at the LAST credit-bureau pull, i.e. after origination and after any
    # delinquency has fed through. The classic LendingClub leakage pair. They were only
    # ever kept out of the model by the IV ceiling (max_iv), which is a tunable heuristic,
    # not a policy: raising that knob would have walked them straight into the scorecard.
    - last_fico_range_low
    - last_fico_range_high
    - out_prncp
    - out_prncp_inv
    - funded_amnt_inv
    - settlement_status
    - settlement_date
    - settlement_amount
    - settlement_percentage
    - settlement_term
    - debt_settlement_flag
    - debt_settlement_flag_date
    - hardship_flag
    - hardship_type
    - hardship_reason
    - hardship_status
    - hardship_amount
    - hardship_start_date
    - hardship_end_date
    - payment_plan_start_date
    - hardship_length
    - hardship_dpd
    - hardship_loan_status
    - orig_projected_additional_accrued_interest
    - hardship_payoff_balance_amount
    - hardship_last_payment_amount
    - loan_status         # target itself
  # Features known at origination that override deny-list (if accidentally matched)
  allow_overrides: []

# ── Train/OOT split (by issue_d) ─────────────────────────────────────────────
split:
  train_cutoff: "2015-01-01"   # train = issue_d < this
  oot_cutoff: "2016-01-01"     # oot = issue_d >= this; in-time test = random sample from train
  holdout_frac: 0.20           # fraction of train period used as in-time holdout

# ── Scorecard parameters ──────────────────────────────────────────────────────
scorecard:
  pdo: 20             # points to double the odds
  base_score: 600
  base_odds: 50.0     # good:bad = 50:1 at base_score
  min_iv: 0.02
  max_iv: 0.50
  max_vif: 5.0

# ── LGD ───────────────────────────────────────────────────────────────────────
lgd:
  downturn_percentile: 90   # percentile of severity distribution used as downturn LGD

# ── Basel IRB ─────────────────────────────────────────────────────────────────
basel:
  pd_floor: 0.0003        # 0.03%
  capital_ratio: 0.08     # 8% minimum capital
  # (removed) maturity_adjustment: retail exposures never carry one, so the flag was
  # declared but never read by risk/basel_irb.py. The absence is structural, not a setting.
  stress_rho: 0.15        # ASRF retail asset correlation for stress test
  stress_z: -2.0          # Vasicek systematic factor: severe recession (2.28% prob)

# ── Economic Capital (Monte Carlo ASRF loss distribution) ────────────────────
econ_cap:
  n_simulations: 50000
  rho: 0.15            # asset correlation to the systematic factor
  es_alpha: 0.999      # VaR / Expected Shortfall confidence level
  seed: 42
  n_buckets: 50        # PD-ranked buckets for tractable simulation

# ── Macro time-series diagnostics (Granger / AIC lag / Johansen-VECM) ─────────
macro_ts:
  max_lag: 4

# ── IFRS 9 ────────────────────────────────────────────────────────────────────
ifrs9:
  sicr_pd_multiplier: 2.5    # lifetime PD must increase by this multiple for SICR
  sicr_abs_threshold: 0.20   # absolute lifetime-PD level that triggers SICR (Stage 2)
  # DECLARED, NOT CONSUMED. Both DPD thresholds are the IFRS 9 standard values and are kept
  # here to document what a production deployment would use, but neither is read: this
  # dataset has no monthly servicing panel, so there is no days-past-due measure at the
  # reporting date to compare them against. assign_stages() instead applies the documented
  # application-time proxy `delinq_2yrs >= 1` for the Stage 2 backstop, and takes Stage 3
  # from the loan's terminal resolved status. See the report's limitations section.
  sicr_dpd_backstop: 30      # days past due backstop for Stage 2 (not consumed)
  stage3_dpd: 90             # days past due for Stage 3 (not consumed)
  # Macro scenarios: probability-weighted.
  # Convention (Vasicek Eq. 15): macro_shock is the systematic factor Z.
  # Z < 0 = adverse shock (recession, higher hazard); Z > 0 = favourable shock.
  # NOTE: these macro_shock values are a FALLBACK only. The pipeline derives the
  # scenario Z-shocks from the fitted macro OLS model (fit_macro_model) and overrides
  # them; they apply only when that regression cannot be fitted. The weights below ARE
  # used in all cases.
  scenarios:
    baseline:
      weight: 0.50
      macro_shock: 0.0        # no shock = central expectation
    upside:
      weight: 0.25
      macro_shock: 0.3        # positive Z = lower hazard (better economy)
    downside:
      weight: 0.25
      macro_shock: -0.5       # negative Z = higher hazard (worse economy)
  # (removed) macro_gamma: the hazard macro overlay is a Vasicek single-factor
  # transform, h_PiT = Phi((Phi^-1(h) - sqrt(rho)*Z)/sqrt(1-rho)), parameterised by the
  # asset correlation rho — not an exp(gamma*Z) hazard scale. The gamma setting was never
  # read by the model (AUDIT-B5).
  # Macro regression: charge-offs lag the cycle and origination underwriting drifts,
  # so the raw contemporaneous UNRATE coefficient can carry a spurious (negative) sign.
  macro_unrate_lag: 2              # quarters to lag macro series vs origination cohort
  macro_enforce_sign_priors: true  # impose economic signs on scenario projection

# ── Business layer ────────────────────────────────────────────────────────────
business:
  # (removed) interest_revenue_rate / cost_per_approval: both belonged to the flat-rate
  # profit sweep that the RAROC-hurdle rule replaced, and neither was read afterwards.
  # Cut-off economics — RAROC-hurdle decision rule (Phase 9)
  fee_income_rate: 0.01         # upfront fee income (fraction of EAD)
  funding_cost_rate: 0.04       # cost of funds (fraction of EAD)
  operating_cost_rate: 0.015    # servicing/operating cost (fraction of EAD)
  cost_of_capital: 0.12         # required return on economic capital
  raroc_hurdle: 0.15            # cost-of-capital hurdle referenced in RAROC framing
  max_bad_rate: 0.15            # board risk-appetite ceiling on approved bad rate

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  outputs: outputs
  reports: reports
  figures: reports/figures
  models: outputs

